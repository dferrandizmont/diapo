name: diapo
description: "Free film camera: live film looks, rolls that develop, no account, no watermark."
publish_to: 'none'
version: 0.1.2+9

environment:
  sdk: ^3.13.5

dependencies:
  camera: ^0.12.2
  film_recipes:
    path: packages/film_recipes
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  intl: ^0.20.3
  path_provider: ^2.1.6
  shared_preferences: ^2.5.3
  cryptography: ^2.9.0
  flutter_secure_storage: ^11.2.0
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  image_picker: ^1.2.4
  sensors_plus: ^7.1.1
  # The store's own review dialog (Play In-App Review, StoreKit), asked at most
  # three times after real use; the app sends nothing itself.
  in_app_review: ^2.0.12

dev_dependencies:
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - LICENSE
    - NOTICE.md
    - assets/fonts/OFL-ChakraPetch.txt
    - assets/fonts/OFL-BarlowSemiCondensed.txt
    - assets/fonts/OFL-BowlbyOne.txt
    - assets/fonts/OFL-SpaceMono.txt
    - assets/fonts/OFL-Caveat.txt
    - packages/film_recipes/assets/recipes.json
    - assets/sounds/shutter.wav
    - assets/sounds/advance.wav
    - assets/sounds/cartridge.wav
    - assets/sounds/load.wav
    - assets/sounds/rewind.wav
    - docs/legal/politica-privacidad.md
    - docs/legal/politica-privacidad.ca.md
    - docs/legal/politica-privacidad.en.md
    - docs/legal/aviso-legal.md
    - docs/legal/aviso-legal.ca.md
    - docs/legal/aviso-legal.en.md
  generate: true
  fonts:
    - family: ChakraPetch
      fonts:
        - asset: assets/fonts/ChakraPetch-Regular.ttf
          weight: 400
        - asset: assets/fonts/ChakraPetch-Medium.ttf
          weight: 500
        - asset: assets/fonts/ChakraPetch-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ChakraPetch-Bold.ttf
          weight: 700
    - family: BarlowSemiCondensed
      fonts:
        - asset: assets/fonts/BarlowSemiCondensed-Regular.ttf
          weight: 400
        - asset: assets/fonts/BarlowSemiCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/BarlowSemiCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowSemiCondensed-Bold.ttf
          weight: 700
    - family: BowlbyOne
      fonts:
        - asset: assets/fonts/BowlbyOne-Regular.ttf
          weight: 400
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700
    # Variable font (weight axis 400-700); the weight is set with FontVariation.
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-Variable.ttf
  shaders:
    - shaders/film.frag

appId: io.github.dferrandizmont.carrete
---
# Wait for capture readiness before and after pressing the shutter.
# Saving/developing may continue later; callers also wait for gallery results.
- extendedWaitUntil:
    visible:
      text: "Disparar"
      enabled: true
    timeout: 30000
- tapOn:
    text: "Disparar"
    enabled: true
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible:
      text: "Disparar"
      enabled: true
    timeout: 30000

appId: es.diapo.app
---
# 0.1.0: a new user goes straight to the camera; the swipe hint may show.
- launchApp:
    clearState: true
    permissions:
      camera: allow
      notifications: allow
- extendedWaitUntil:
    visible:
      text: "Disparar"
      enabled: true
    timeout: 30000
- runFlow:
    when:
      visible: "Cerrar consejo"
    commands:
      - tapOn: "Cerrar consejo"

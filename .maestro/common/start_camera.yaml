appId: io.github.dferrandizmont.carrete
---
- launchApp:
    clearState: true
    permissions:
      camera: allow
      notifications: allow
- extendedWaitUntil:
    visible: "Saltar"
    timeout: 30000
- tapOn: "Saltar"
- extendedWaitUntil:
    visible:
      text: "Disparar"
      enabled: true
    timeout: 30000
- assertVisible: "Ninguna foto en esta sesión"

appId: es.diapo.app
---
- runFlow: common/start_camera.yaml
- runFlow: common/shoot_once.yaml
- tapOn: "Galería"
- extendedWaitUntil:
    visible: ".*Fotos sueltas, Hoy, .*1 foto.*"
    timeout: 60000
- tapOn: ".*Fotos sueltas, Hoy, .*1 foto.*"
- tapOn: ".*Fotograma 1.*"
- assertVisible: "Foto 1 de 1"
- tapOn: "Borrar"
- assertVisible: '¿Borrar esta foto\?'
- tapOn: "Borrar"
# Deleting the only photo of the day closes the viewer and the day: back in
# the gallery, which is empty.
- extendedWaitUntil:
    visible: "(?s)Aún no hay fotos.*"
    timeout: 30000
- assertNotVisible: ".*Fotograma 1.*"
- assertNotVisible: "No encuentro este día"
- assertNotVisible: ".*Fotos sueltas,.*"

appId: io.github.dferrandizmont.carrete
---
- runFlow: common/start_camera.yaml
# Seed MediaStore independently of suite order and wait until export completes.
- runFlow: common/shoot_once.yaml
- tapOn: "Galería"
- extendedWaitUntil:
    visible: ".*Fotos sueltas, Hoy, .*1 foto.*"
    timeout: 60000
- tapOn: ".*Revelar fotos del móvil.*"
- waitForAnimationToEnd:
    timeout: 5000
# Android 36 Spanish exposes "Foto tomado el …" for each thumbnail.
- tapOn:
    text: ".*(Foto tomado el|Photo taken on).*"
    index: 0
# Single-photo pickers can return immediately; others require confirmation.
- tapOn:
    text: "(?i)(Done|Listo|Añadir|Agregar|Add)(.*)"
    optional: true
- extendedWaitUntil:
    visible: "Revelar la foto"
    timeout: 30000
- scrollUntilVisible:
    element: ".*Diapositiva fría.*"
    direction: RIGHT
    timeout: 15000
- tapOn: ".*Diapositiva fría.*"
- assertVisible: ".*Foto 1 de 1, con la película Diapositiva fría.*"
- tapOn: "Revelar la foto"
# A successful export returns directly to the app gallery.
- extendedWaitUntil:
    visible: ".*Fotos sueltas, .*Diapositiva fría.*2 fotos.*"
    timeout: 120000
- assertVisible: ".*Revelar fotos del móvil.*"

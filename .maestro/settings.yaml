appId: io.github.dferrandizmont.carrete
---
- runFlow: common/start_camera.yaml
- tapOn: "Ajustes"
- tapOn: "Cuadrícula"
- assertVisible:
    text: "Cuadrícula"
    checked: true
- tapOn: "Cuadrícula"
- assertVisible:
    text: "Cuadrícula"
    checked: false
- tapOn: "Nivel"
- assertVisible:
    text: "Nivel"
    checked: true
- tapOn: "Nivel"
- assertVisible:
    text: "Nivel"
    checked: false
# Sounds start enabled on a clean install.
- tapOn: "Sonidos de la cámara"
- assertVisible:
    text: "Sonidos de la cámara"
    checked: false
- tapOn: "Sonidos de la cámara"
- assertVisible:
    text: "Sonidos de la cámara"
    checked: true
- scrollUntilVisible:
    element: "Guardar también el original"
    direction: DOWN
- tapOn: "Guardar también el original"
- assertVisible:
    text: "Guardar también el original"
    checked: true
- tapOn: "Guardar también el original"
- assertVisible:
    text: "Guardar también el original"
    checked: false
- scrollUntilVisible:
    element: "Día primero: .*"
    direction: DOWN
- tapOn: "Día primero: .*"
- assertVisible:
    text: "Día primero: .*"
    selected: true
- tapOn: "Año primero: .*"
- assertVisible:
    text: "Año primero: .*"
    selected: true
- scrollUntilVisible:
    element: "Diapositiva fría"
    direction: DOWN
- tapOn: "Diapositiva fría"
- assertVisible:
    text: "Diapositiva fría"
    selected: true
- scrollUntilVisible:
    element: "Oscuro"
    direction: DOWN
- tapOn: "Oscuro"
- assertVisible:
    text: "Oscuro"
    selected: true
- tapOn: "Claro"
- assertVisible:
    text: "Claro"
    selected: true
- scrollUntilVisible:
    element: "Català"
    direction: DOWN
- tapOn: "Català"
# Language names are identical in every translation, including Catalan.
- assertVisible:
    text: "Català"
    selected: true
- tapOn: "Español"
- assertVisible:
    text: "Español"
    selected: true
- scrollUntilVisible:
    element: "Licencias"
    direction: DOWN
- tapOn: "Licencias"
# LicensePage merges the app name, version and Flutter attribution on new lines.
- assertVisible: "(?s)Carrete.*"
- back
- assertVisible: "Licencias"
- back
- assertVisible: "Disparar"
- assertVisible:
    text: ".*Diapositiva fría.*"
    selected: true

appId: es.diapo.app
---
- runFlow: common/start_camera.yaml
- tapOn: "Cargar carrete"
- scrollUntilVisible:
    element: "Cámara desechable.*"
    direction: DOWN
- tapOn: "Cámara desechable.*"
- assertVisible: 'Tiene 27 fotos y una película fija\..*'
- tapOn: "Al momento"
- scrollUntilVisible:
    element: "Empezar"
    direction: DOWN
- tapOn: "Empezar"
# Android can cover the first immersive screen with a system education hint.
- tapOn:
    text: "(?i)(Entendido|Got it)"
    optional: true
- extendedWaitUntil:
    visible: "(?i)27 fotos · usar y tirar"
    timeout: 30000
- runFlow: common/shoot_once.yaml
- assertVisible: "Quedan 26 fotos"
- back
- assertVisible: "Quedan 26 fotos"
- assertNotVisible: "Galería"
- assertNotVisible: "Ajustes"
- assertVisible: 'Salir de la cámara desechable\. Mantén pulsado durante dos segundos\.'
# 2.12.1 longPressOn has no duration. A stationary swipe holds the pointer.
# Initial portrait estimate of the stamp centre; calibrate both points together.
- swipe:
    start: "82%, 8%"
    end: "82%, 8%"
    duration: 2500
- assertVisible: '¿Salir de la cámara desechable\?'
- assertVisible: 'Quedan 26 fotos, que se guardan para más tarde\..*'
- tapOn: "Salir"
- extendedWaitUntil:
    visible: "Galería"
    timeout: 30000
- assertVisible: "Disparar"
# The unfinished disposable remains available after leaving the lock.
# 0.1.0: the roll key says the disposable is paused.
- assertVisible: "Cámara desechable en pausa, quedan 26 fotos"
- tapOn: "Cámara desechable en pausa.*"
- assertVisible: "Seguir con la desechable"

appId: es.diapo.app
---
- runFlow: common/start_camera.yaml
# The shared start clears the app database, including earlier flows' photos.
- tapOn: "Galería"
- assertVisible: "(?s)Aún no hay fotos.*"
- back
- tapOn: "Cargar carrete"
- tapOn: "12 fotos"
- tapOn: "1 hora"
- scrollUntilVisible:
    element: "Cargar carrete"
    direction: DOWN
- tapOn: "Cargar carrete"
- assertVisible: "Quedan 12 fotos"
- runFlow: common/shoot_once.yaml
- assertVisible: "Quedan 11 fotos"
- tapOn: "Carrete cargado, quedan 11 fotos"
- scrollUntilVisible:
    element: "Tirar el carrete"
    direction: DOWN
- tapOn: "Tirar el carrete"
- assertVisible: '¿Tirar el carrete\?'
- tapOn: "Tirar"
- extendedWaitUntil:
    visible: "Cargar carrete"
    timeout: 30000
- tapOn: "Galería"
- assertVisible: "(?s)Aún no hay fotos.*"
- assertNotVisible: ".*Fotos sueltas,.*"
- assertNotVisible: ".*Carrete [0-9]+,.*"
